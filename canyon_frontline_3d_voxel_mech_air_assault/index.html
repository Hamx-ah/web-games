<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Canyon Frontline 3D - Retro Voxel Shooter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #12080c;
            font-family: 'Share Tech Mono', monospace;
            cursor: crosshair;
        }
        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
        }
        .crt-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 15;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.24) 50%), 
                radial-gradient(circle at center, transparent 58%, rgba(8, 2, 4, 0.58) 100%);
            background-size: 100% 4px, 100% 100%;
        }
        .hud-box {
            background: rgba(10, 22, 14, 0.76);
            border: 2px solid #48b868;
            box-shadow: 0 0 12px rgba(72, 184, 104, 0.4), inset 0 0 8px rgba(72, 184, 104, 0.22);
            border-radius: 6px;
        }
        .hud-text {
            font-family: 'Press Start 2P', monospace;
            color: #5eff82;
            text-shadow: 0 0 6px rgba(94, 255, 130, 0.65);
        }
        .bar-segment-red {
            background: linear-gradient(to bottom, #ff5252 0%, #c62828 60%, #7f1212 100%);
            box-shadow: 0 0 5px rgba(255, 82, 82, 0.65);
        }
        .bar-segment-blue {
            background: linear-gradient(to bottom, #4fc3f7 0%, #0288d1 60%, #014368 100%);
            box-shadow: 0 0 5px rgba(79, 195, 247, 0.65);
        }
        .bar-segment-empty {
            background: rgba(18, 32, 22, 0.78);
        }
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 25;
            transition: transform 0.05s ease-out;
        }
        .hit-flash {
            filter: drop-shadow(0 0 10px #ffeb3b) brightness(1.9);
            transform: translate(-50%, -50%) scale(1.38) !important;
        }
        #damage-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 14;
            background: radial-gradient(circle, transparent 48%, rgba(255, 25, 25, 0.68) 100%);
            opacity: 0;
            transition: opacity 0.14s ease-out;
        }
        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 4px rgba(94, 255, 130, 0.6)); }
            50% { filter: drop-shadow(0 0 10px rgba(94, 255, 130, 1)); }
        }
        .glow-icon {
            animation: pulseGlow 2.4s infinite;
        }
    </style>
</head>
<body>

    <script>
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) {
                        this.ctx = new AudioCtx();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playRifleShot() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(42, now + 0.085);

                gain.gain.setValueAtTime(0.16, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.09);

                this.playNoise(0.055, 0.14, 1500);
            }

            playMissileLaunch() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(115, now);
                osc.frequency.linearRampToValueAtTime(540, now + 0.18);
                osc.frequency.exponentialRampToValueAtTime(85, now + 0.48);

                gain.gain.setValueAtTime(0.22, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.49);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.49);

                this.playNoise(0.38, 0.18, 850);
            }

            playExplosion(scale = 1.0) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const dur = Math.min(0.95, 0.4 * scale);

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(98, now);
                osc.frequency.exponentialRampToValueAtTime(20, now + dur);

                gain.gain.setValueAtTime(0.34 * Math.min(scale, 1.4), now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + dur);

                this.playNoise(dur, 0.26 * Math.min(scale, 1.3), 480);
            }

            playLaser() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(720, now);
                osc.frequency.exponentialRampToValueAtTime(105, now + 0.14);

                gain.gain.setValueAtTime(0.065, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.14);
            }

            playHitMarker() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1380, now);
                osc.frequency.setValueAtTime(1820, now + 0.025);

                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.06);
            }

            playNoise(duration, volume, filterFreq) {
                if (!this.ctx) return;
                const bufferSize = Math.floor(this.ctx.sampleRate * duration);
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = filterFreq;

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start();
            }
        }

        const sfx = new SoundEngine();

        const canvas = document.getElementById('game-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.12;

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x572422, 0.0038);

        const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 650);
        const playerState = {
            pos: new THREE.Vector3(0, 3.3, 42),
            vel: new THREE.Vector3(),
            yaw: 0,
            pitch: 0.03,
            targetYaw: 0,
            targetPitch: 0.03,
            hp: 100,
            maxHp: 100,
            shield: 100,
            maxShield: 100,
            squadHp: 100,
            ammo: 32,
            maxAmmo: 32,
            missiles: 8,
            maxMissiles: 8,
            missileCooldown: 0,
            reloading: false,
            score: 4250,
            kills: 14,
            wave: 1,
            weaponMode: 0,
            pointerLocked: false,
            autoFire: false,
            targetAssist: true,
            mouseNDC: new THREE.Vector2(0, 0),
            isFiring: false,
            lastShotTime: 0,
            walkBob: 0,
            fxMode: 2,
            chromaIntensity: 0,
            screenShake: 0
        };

        camera.position.copy(playerState.pos);
        scene.add(camera);

        const ambientLight = new THREE.AmbientLight(0xff9c72, 0.62);
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0xff844b, 0x381912, 0.65);
        scene.add(hemiLight);

        const sunLight = new THREE.DirectionalLight(0xffcf82, 1.65);
        sunLight.position.set(20, 54, -185);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 10;
        sunLight.shadow.camera.far = 330;
        const shadowBounds = 98;
        sunLight.shadow.camera.left = -shadowBounds;
        sunLight.shadow.camera.right = shadowBounds;
        sunLight.shadow.camera.top = shadowBounds;
        sunLight.shadow.camera.bottom = -shadowBounds;
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);

        const muzzlePointLight = new THREE.PointLight(0xffb74d, 0, 18);
        scene.add(muzzlePointLight);

        const dynamicLights = [];
        for (let i = 0; i < 6; i++) {
            const pLight = new THREE.PointLight(0xff7733, 0, 34);
            scene.add(pLight);
            dynamicLights.push({ light: pLight, life: 0, maxLife: 0.35, maxIntensity: 3.5 });
        }

        function triggerDynamicLight(pos, colorHex, intensity, duration) {
            for (let i = 0; i < dynamicLights.length; i++) {
                const dl = dynamicLights[i];
                if (dl.life <= 0) {
                    dl.light.position.copy(pos);
                    dl.light.color.setHex(colorHex);
                    dl.light.intensity = intensity;
                    dl.maxIntensity = intensity;
                    dl.life = duration;
                    dl.maxLife = duration;
                    return;
                }
            }
        }

        let composer = null;
        let bloomPass = null;
        let retroGodRayPass = null;

        const RetroGodRayShader = {
            uniforms: {
                tDiffuse: { value: null },
                sunScreenPos: { value: new THREE.Vector2(0.58, 0.62) },
                godRayIntensity: { value: 0.28 },
                chromaAmount: { value: 0.0 },
                time: { value: 0.0 },
                enableCRT: { value: 1.0 }
            },
            vertexShader: [
                "varying vec2 vUv;",
                "void main() {",
                "    vUv = uv;",
                "    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);",
                "}"
            ].join("\n"),
            fragmentShader: [
                "uniform sampler2D tDiffuse;",
                "uniform vec2 sunScreenPos;",
                "uniform float godRayIntensity;",
                "uniform float chromaAmount;",
                "uniform float time;",
                "uniform float enableCRT;",
                "varying vec2 vUv;",
                "void main() {",
                "    vec2 uv = vUv;",
                "    vec2 centered = uv - 0.5;",
                "    float distFromCenter = length(centered);",
                "    float ca = 0.0012 + chromaAmount * 0.009;",
                "    vec2 caOffset = centered * ca;",
                "    float r = texture2D(tDiffuse, uv + caOffset).r;",
                "    float g = texture2D(tDiffuse, uv).g;",
                "    float b = texture2D(tDiffuse, uv - caOffset).b;",
                "    vec3 col = vec3(r, g, b);",
                "    if (godRayIntensity > 0.01) {",
                "        vec2 delta = (uv - sunScreenPos) * (1.0 / 24.0) * 0.85;",
                "        vec2 sampleUv = uv;",
                "        float illuminationDecay = 1.0;",
                "        vec3 rays = vec3(0.0);",
                "        for (int i = 0; i < 24; i++) {",
                "            sampleUv -= delta;",
                "            vec3 samp = texture2D(tDiffuse, clamp(sampleUv, 0.0, 1.0)).rgb;",
                "            float luma = dot(samp, vec3(0.299, 0.587, 0.114));",
                "            float brightMask = smoothstep(0.68, 1.0, luma);",
                "            rays += samp * brightMask * illuminationDecay * 0.055;",
                "            illuminationDecay *= 0.935;",
                "        }",
                "        col += rays * vec3(1.0, 0.72, 0.36) * godRayIntensity;",
                "    }",
                "    if (enableCRT > 0.5) {",
                "        float scanline = sin(uv.y * 850.0) * 0.035;",
                "        col -= scanline;",
                "        col *= (1.03 - distFromCenter * 0.26);",
                "    }",
                "    gl_FragColor = vec4(col, 1.0);",
                "}"
            ].join("\n")
        };

        function createRetroSunsetTexture() {
            const c = document.createElement('canvas');
            c.width = 512;
            c.height = 256;
            const ctx = c.getContext('2d');

            const bands = [
                { stop: 0.00, color: '#1d0f28' },
                { stop: 0.12, color: '#331634' },
                { stop: 0.25, color: '#541e3a' },
                { stop: 0.38, color: '#7d2638' },
                { stop: 0.52, color: '#ac3931' },
                { stop: 0.65, color: '#d85b2b' },
                { stop: 0.77, color: '#f3892f' },
                { stop: 0.88, color: '#ffc24b' },
                { stop: 0.95, color: '#ffe885' },
                { stop: 1.00, color: '#ffffcc' }
            ];

            for (let y = 0; y < c.height; y++) {
                const t = y / c.height;
                let chosen = bands[0].color;
                for (let b = 0; b < bands.length; b++) {
                    if (t >= bands[b].stop) chosen = bands[b].color;
                }
                ctx.fillStyle = chosen;
                ctx.fillRect(0, y, c.width, 1);
            }

            const cloudColors = ['#471a30', '#702437', '#a83631', '#df662c', '#fca641'];
            for (let i = 0; i < 48; i++) {
                const cx = Math.floor(Math.random() * 64) * 8;
                const cy = Math.floor(Math.random() * 24) * 8 + 12;
                const cw = (Math.floor(Math.random() * 14) + 6) * 8;
                const ch = (Math.floor(Math.random() * 2) + 1) * 6;
                const cIdx = Math.min(cloudColors.length - 1, Math.floor((cy / c.height) * cloudColors.length));
                ctx.fillStyle = cloudColors[cIdx];
                ctx.fillRect(cx, cy, cw, ch);
                ctx.fillStyle = '#ffcf6e';
                ctx.fillRect(cx + 4, cy + ch - 2, cw - 8, 2);
            }

            const tex = new THREE.CanvasTexture(c);
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
            return tex;
        }

            if (playerState.weaponMode === 1 && isFriendly && !isHoming) {

            const beam = new THREE.Mesh(new THREE.BoxGeometry(thickness, thickness, length), colorMat);

        function getAimDirection() {
            const ndc = playerState.pointerLocked ? new THREE.Vector2(0, 0) : playerState.mouseNDC;
            raycaster.setFromCamera(ndc, camera);

            if (playerState.targetAssist) {
                let bestEnemy = null;
                let bestAngle = 0.088;
                const rayOrigin = raycaster.ray.origin;
                const rayDir = raycaster.ray.direction;

                for (let i = 0; i < enemies.length; i++) {
                    const e = enemies[i];
                    const center = e.mesh.position.clone().add(new THREE.Vector3(0, e.hitHeight, 0));
                    const toEnemy = center.sub(rayOrigin).normalize();
                    const angle = rayDir.angleTo(toEnemy);
                    if (angle < bestAngle) {
                        bestAngle = angle;
                        bestEnemy = e;
                    }
                }

                if (bestEnemy) {
                    const targetCenter = bestEnemy.mesh.position.clone().add(new THREE.Vector3(0, bestEnemy.hitHeight, 0));
                    return targetCenter.sub(rayOrigin).normalize();
                }
            }

            return raycaster.ray.direction.clone().normalize();
        }

        function firePrimaryWeapon() {
            if (playerState.reloading) return;
            const now = performance.now();
            const fireInterval = playerState.weaponMode === 0 ? 105 : 160;
            if (now - playerState.lastShotTime < fireInterval) return;

            if (playerState.ammo <= 0) {
                reloadWeapon();
                return;
            }

            playerState.lastShotTime = now;
            playerState.ammo--;
            updateHUD();

            sfx.playRifleShot();

            fpWeaponGroup.position.z = -0.94;
            fpWeaponGroup.rotation.x = 0.12;
            fpMuzzleFlash.visible = true;

            const muzzleWorld = new THREE.Vector3();
            fpMuzzleFlash.getWorldPosition(muzzleWorld);
            muzzlePointLight.position.copy(muzzleWorld);
            muzzlePointLight.intensity = 2.8;

            spawnShellCasing(muzzleWorld);

            setTimeout(() => {
                fpMuzzleFlash.visible = false;
                muzzlePointLight.intensity = 0;
            }, 45);

            const aimDir = getAimDirection();
            aimDir.x += (Math.random() - 0.5) * 0.011;
            aimDir.y += (Math.random() - 0.5) * 0.011;

            if (playerState.missiles <= 0 || playerState.missileCooldown > 0) return;

            playerState.missiles--;
            playerState.missileCooldown = 1.35;
            updateHUD();
            sfx.playMissileLaunch();

            const aimDir = getAimDirection();
            let lockedEnemy = null;
            let bestScore = Infinity;

            for (let i = 0; i < enemies.length; i++) {
                const e = enemies[i];
                const center = e.mesh.position.clone().add(new THREE.Vector3(0, e.hitHeight, 0));
                const dirToE = center.clone().sub(camera.position).normalize();
                const angle = aimDir.angleTo(dirToE);
                if (angle < bestScore) {
                    bestScore = angle;
                    lockedEnemy = e;
                }
            }

            const launchOrigin = camera.position.clone().add(new THREE.Vector3(-0.6, -0.3, -1.0).applyQuaternion(camera.quaternion));
            spawnTracerProjectile(launchOrigin, aimDir, true, true, true, lockedEnemy);

            fpWeaponGroup.position.z = -0.86;
            showCombatAlert(lockedEnemy ? `HOMING MISSILE LOCKED ON ${lockedEnemy.type.toUpperCase()}!` : `MISSILE LAUNCHED!`);

        function drawRadar(dt) {
            const w = radarCanvas.width;
            const h = radarCanvas.height;
            const cx = w / 2;
            const cy = h / 2;
            const r = cx - 4;

            radarCtx.clearRect(0, 0, w, h);

            radarCtx.fillStyle = 'rgba(10, 28, 16, 0.88)';
            radarCtx.beginPath();
            radarCtx.arc(cx, cy, r, 0, Math.PI * 2);
            radarCtx.fill();

            radarCtx.strokeStyle = 'rgba(72, 184, 104, 0.45)';
            radarCtx.lineWidth = 1;
            [0.35, 0.68, 1.0].forEach((scale) => {
                radarCtx.beginPath();
                radarCtx.arc(cx, cy, r * scale, 0, Math.PI * 2);
                radarCtx.stroke();
            });

            radarCtx.beginPath();
            radarCtx.moveTo(cx - r, cy);
            radarCtx.lineTo(cx + r, cy);
            radarCtx.moveTo(cx, cy - r);
            radarCtx.lineTo(cx, cy + r);
            radarCtx.stroke();

            radarAngle = (radarAngle + dt * 2.4) % (Math.PI * 2);
            const grad = radarCtx.createConicGradient ? radarCtx.createConicGradient(radarAngle, cx, cy) : null;
            if (grad) {
                grad.addColorStop(0, 'rgba(94, 255, 130, 0.48)');
                grad.addColorStop(0.18, 'rgba(94, 255, 130, 0.0)');
                grad.addColorStop(1, 'rgba(94, 255, 130, 0.0)');
                radarCtx.fillStyle = grad;
                radarCtx.beginPath();
                radarCtx.arc(cx, cy, r, 0, Math.PI * 2);
                radarCtx.fill();
            } else {
                radarCtx.fillStyle = 'rgba(94, 255, 130, 0.28)';
                radarCtx.beginPath();
                radarCtx.moveTo(cx, cy);
                radarCtx.arc(cx, cy, r, radarAngle - 0.5, radarAngle);
                radarCtx.closePath();
                radarCtx.fill();
            }

            allies.forEach((a) => {
                const dx = (a.mesh.position.x - playerState.pos.x) * 0.7;
                const dz = (a.mesh.position.z - playerState.pos.z) * 0.45;
                const bx = cx + dx;
                const by = cy + dz;
                if (Math.hypot(bx - cx, by - cy) < r - 3) {
                    radarCtx.fillStyle = '#5eff82';
                    radarCtx.fillRect(bx - 2, by - 2, 4, 4);
                }
            });

            enemies.forEach((e) => {
                const dx = (e.mesh.position.x - playerState.pos.x) * 0.65;
                const dz = (e.mesh.position.z - playerState.pos.z) * 0.42;
                const bx = cx + dx;
                const by = cy + dz;
                if (Math.hypot(bx - cx, by - cy) < r - 3) {
                    if (e.type === 'mech') {
                        radarCtx.fillStyle = '#ff3b30';
                        radarCtx.fillRect(bx - 3.5, by - 3.5, 7, 7);
                    } else if (e.type === 'plane') {
                        radarCtx.fillStyle = '#ffd54f';
                        radarCtx.fillRect(bx - 2, by - 2, 4, 4);
                    } else {
                        radarCtx.fillStyle = '#ff6e40';
                        radarCtx.fillRect(bx - 2.5, by - 2.5, 5, 5);
                    }
                }
            });

            radarCtx.fillStyle = '#ffffff';
            radarCtx.beginPath();
            radarCtx.arc(cx, cy, 2.5, 0, Math.PI * 2);
            radarCtx.fill();
        }

        let lastTime = performance.now();

        function updateGame(dt, elapsed) {
            const moveSpeed = 14.0;
            let moveX = 0;
            let moveZ = 0;
            if (keys['KeyW'] || keys['ArrowUp']) moveZ -= 1;
            if (keys['KeyS'] || keys['ArrowDown']) moveZ += 1;
            if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

            if (moveX !== 0 || moveZ !== 0) {
                const forward = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), playerState.yaw);
                const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), playerState.yaw);
                playerState.pos.addScaledVector(forward, moveZ * moveSpeed * dt);
                playerState.pos.addScaledVector(right, moveX * moveSpeed * dt);

                playerState.pos.x = Math.max(-18, Math.min(18, playerState.pos.x));
                playerState.pos.z = Math.max(24, Math.min(48, playerState.pos.z));
                playerState.walkBob += dt * 11;
            }

            playerState.yaw += (playerState.targetYaw - playerState.yaw) * Math.min(1, dt * 12);
            playerState.pitch += (playerState.targetPitch - playerState.pitch) * Math.min(1, dt * 12);

            playerState.screenShake = Math.max(0, playerState.screenShake - dt * 1.8);
            playerState.chromaIntensity = Math.max(0, playerState.chromaIntensity - dt * 2.2);

            const shakeX = (Math.random() - 0.5) * playerState.screenShake;
            const shakeY = (Math.random() - 0.5) * playerState.screenShake;

            camera.position.set(
                playerState.pos.x + shakeX,
                playerState.pos.y + Math.sin(playerState.walkBob) * 0.08 + shakeY,
                playerState.pos.z
            );
            camera.rotation.order = 'YXZ';
            camera.rotation.y = playerState.yaw;
            camera.rotation.x = playerState.pitch;

            fpWeaponGroup.position.z += (-1.15 - fpWeaponGroup.position.z) * Math.min(1, dt * 14);
            fpWeaponGroup.rotation.x += (0.04 - fpWeaponGroup.rotation.x) * Math.min(1, dt * 14);

            for (let i = 0; i < dynamicLights.length; i++) {
                const dl = dynamicLights[i];
                if (dl.life > 0) {
                    dl.life -= dt;
                    dl.light.intensity = Math.max(0, (dl.life / dl.maxLife) * dl.maxIntensity);
                }
            }

            for (let i = 0; i < dustClouds.length; i++) {
                const dc = dustClouds[i];
                dc.mesh.position.x += dc.speed * dt;
                if (dc.mesh.position.x > 35) dc.mesh.position.x = -35;
            }

            for (let i = 0; i < bunkerTurrets.length; i++) {
                bunkerTurrets[i].rotation.y = Math.sin(elapsed * 0.8 + i) * 0.45;
            }

            if (retroGodRayPass) {
                const sunProj = sunGroup.position.clone().project(camera);
                retroGodRayPass.uniforms.sunScreenPos.value.set(
                    sunProj.x * 0.5 + 0.5,
                    sunProj.y * 0.5 + 0.5
                );
                retroGodRayPass.uniforms.chromaAmount.value = playerState.chromaIntensity;
                retroGodRayPass.uniforms.time.value = elapsed;
            }

            if (playerState.shield < playerState.maxShield) {
                playerState.shield = Math.min(playerState.maxShield, playerState.shield + dt * 2.5);
            }
            if (playerState.missileCooldown > 0) {
                playerState.missileCooldown = Math.max(0, playerState.missileCooldown - dt);
                const pct = ((1.35 - playerState.missileCooldown) / 1.35) * 100;
                document.getElementById('ordinance-cooldown-fill').style.height = `${pct}%`;
            }

            if (playerState.isFiring || playerState.autoFire) {
                if (playerState.autoFire && !playerState.pointerLocked && enemies.length > 0) {
                    const target = enemies[0];
                    const worldPos = target.mesh.position.clone().add(new THREE.Vector3(0, target.hitHeight, 0));
                    const screenPos = worldPos.clone().project(camera);
                    playerState.mouseNDC.lerp(new THREE.Vector2(screenPos.x, screenPos.y), dt * 4);
                    crosshairEl.style.left = `${(playerState.mouseNDC.x * 0.5 + 0.5) * window.innerWidth}px`;
                    crosshairEl.style.top = `${(-playerState.mouseNDC.y * 0.5 + 0.5) * window.innerHeight}px`;
                }
                firePrimaryWeapon();
            }

            allies.forEach((ally) => {
                ally.cooldown -= dt;
                if (ally.cooldown <= 0 && enemies.length > 0) {
                    const groundEnemies = enemies.filter((e) => e.type !== 'plane');
                    const target = groundEnemies.length > 0
                        ? groundEnemies[Math.floor(Math.random() * groundEnemies.length)]
                        : enemies[Math.floor(Math.random() * enemies.length)];

                    if (target) {
                        const muzzlePos = ally.muzzleWorldOffset.clone().applyMatrix4(ally.mesh.matrixWorld);
                        const targetPos = target.mesh.position.clone().add(new THREE.Vector3(
                            (Math.random() - 0.5) * 2.5,
                            target.hitHeight,
                            (Math.random() - 0.5) * 2.5
                        ));
                        const dir = targetPos.sub(muzzlePos).normalize();

                        spawnTracerProjectile(muzzlePos, dir, true, ally.type === 'tank', false, null);

                        if (ally.type === 'tank' && ally.mesh.userData.cannon) {
                            ally.mesh.userData.cannon.position.z = -3.7;
                            setTimeout(() => {
                                if (ally.mesh.userData.cannon) ally.mesh.userData.cannon.position.z = -4.2;
                            }, 120);
                        }

                        if (ally.mesh.userData.flash) {
                            ally.mesh.userData.flash.visible = true;
                            setTimeout(() => {
                                if (ally.mesh.userData.flash) ally.mesh.userData.flash.visible = false;
                            }, 65);
                        }
                    }
                    ally.cooldown = ally.type === 'tank' ? (1.4 + Math.random() * 1.1) : (0.35 + Math.random() * 0.45);
                }
            });

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];

                if (e.type === 'mech') {
                    const prevSin = Math.sin(e.walkPhase);
                    e.walkPhase += dt * 3.6;
                    const curSin = Math.sin(e.walkPhase);

                    if ((prevSin < 0 && curSin >= 0) || (prevSin > 0 && curSin <= 0)) {
                        spawnSmokePuff(
                            new THREE.Vector3(e.mesh.position.x + (curSin >= 0 ? -2 : 2), 0.5, e.mesh.position.z),
                            1.4,
                            0xbcaaa4
                        );
                    }

                    if (e.mesh.position.z < 10) {
                        e.mesh.position.z += e.speed * dt;
                    } else {
                        e.mesh.position.x += Math.sin(e.walkPhase * 0.4) * 2.2 * dt;
                    }

                    const uData = e.mesh.userData;
                    uData.leftLegGroup.rotation.x = Math.sin(e.walkPhase) * 0.35;
                    uData.rightLegGroup.rotation.x = -Math.sin(e.walkPhase) * 0.35;
                    uData.torsoGroup.position.y = 9.2 + Math.abs(Math.sin(e.walkPhase)) * 0.35;
                    uData.torsoGroup.rotation.y = Math.sin(e.walkPhase * 0.5) * 0.18;
                    uData.barrelLGroup.rotation.z += dt * 12;
                    uData.barrelRGroup.rotation.z -= dt * 12;

                    e.fireCooldown -= dt;
                    if (e.fireCooldown <= 0) {
                        e.fireCooldown = 0.72 + Math.random() * 0.55;
                        const useLeft = Math.random() < 0.5;
                        const flashMesh = useLeft ? uData.flashL : uData.flashR;
                        flashMesh.visible = true;
                        setTimeout(() => { flashMesh.visible = false; }, 75);

                        const muzzleWorld = new THREE.Vector3();
                        flashMesh.getWorldPosition(muzzleWorld);

                        const targetSpot = Math.random() < 0.35
                            ? playerState.pos.clone().add(new THREE.Vector3((Math.random() - 0.5) * 4, -0.5, 0))
                            : new THREE.Vector3((Math.random() - 0.5) * 26, 2.0, 26);

                        const dir = targetSpot.sub(muzzleWorld).normalize();
                        spawnTracerProjectile(muzzleWorld, dir, false, true, false, null);
                        sfx.playLaser();
                    }
                } else if (e.type === 'tank') {
                    if (e.mesh.position.z < 12) {
                        e.mesh.position.z += e.speed * dt;
                    } else {
                        e.mesh.position.z = -75;
                    }

                    e.fireCooldown -= dt;
                    if (e.fireCooldown <= 0) {
                        e.fireCooldown = 2.0 + Math.random() * 1.2;
                        const flash = e.mesh.userData.flash;
                        flash.visible = true;
                        setTimeout(() => { flash.visible = false; }, 70);

                        const muzzleWorld = new THREE.Vector3();
                        flash.getWorldPosition(muzzleWorld);
                        const targetSpot = new THREE.Vector3((Math.random() - 0.5) * 24, 2.2, 28);
                        spawnTracerProjectile(muzzleWorld, targetSpot.sub(muzzleWorld).normalize(), false, true, false, null);
                    }
                } else if (e.type === 'trooper') {
                    e.walkPhase += dt * 10;
                    e.mesh.position.z += e.speed * dt;
                    e.mesh.userData.leftLeg.rotation.x = Math.sin(e.walkPhase) * 0.6;
                    e.mesh.userData.rightLeg.rotation.x = -Math.sin(e.walkPhase) * 0.6;

                    if (e.mesh.position.z > 22) {
                        e.mesh.position.z = -55 - Math.random() * 25;
                        e.mesh.position.x = (Math.random() - 0.5) * 22;
                    }

                    e.fireCooldown -= dt;
                    if (e.fireCooldown <= 0) {
                        e.fireCooldown = 1.1 + Math.random() * 0.9;
                        const flash = e.mesh.userData.flash;
                        flash.visible = true;
                        setTimeout(() => { flash.visible = false; }, 50);

                        const muzzleWorld = new THREE.Vector3();
                        flash.getWorldPosition(muzzleWorld);
                        const targetSpot = new THREE.Vector3((Math.random() - 0.5) * 20, 2.0, 29);
                        spawnTracerProjectile(muzzleWorld, targetSpot.sub(muzzleWorld).normalize(), false, false, false, null);
                    }
                } else if (e.type === 'plane') {
                    e.mesh.userData.propGroup.rotation.z += dt * 38;
                    e.mesh.position.addScaledVector(e.vel, dt);

                    e.smokeTimer -= dt;
                    if (e.smokeTimer <= 0) {
                        e.smokeTimer = 0.05;
                        const tailPos = e.mesh.position.clone().addScaledVector(e.vel.clone().normalize(), -4.2);
                        const isDamaged = e.hp < e.maxHp * 0.55;
                        spawnSmokePuff(tailPos, isDamaged ? 1.4 : 0.98, isDamaged ? 0xff7043 : 0xd7ccc8);
                    }

                    e.fireCooldown -= dt;
                    if (e.fireCooldown <= 0 && e.mesh.position.z > -75 && e.mesh.position.z < 10) {
                        e.fireCooldown = 0.35 + Math.random() * 0.45;
                        const dir = e.vel.clone().normalize();
                        dir.y -= 0.18;
                        spawnTracerProjectile(e.mesh.position.clone(), dir.normalize(), false, false, false, null);
                    }

                    if (Math.abs(e.mesh.position.x) > 105 || e.mesh.position.z > 40) {
                        const fromLeft = Math.random() < 0.5;
                        e.mesh.position.set(fromLeft ? -95 : 95, 25 + Math.random() * 22, -20 - Math.random() * 75);
                        e.vel.set(fromLeft ? (24 + Math.random() * 10) : -(24 + Math.random() * 10), (Math.random() - 0.5) * 3, 8 + Math.random() * 10);
                        const lookAtPt = e.mesh.position.clone().add(e.vel);
                        e.mesh.lookAt(lookAtPt);
                        e.mesh.rotation.z = e.vel.x > 0 ? -0.44 : 0.44;
                    }
                }
            }

            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.life -= dt;

                if (p.isHoming) {
                    p.smokeTimer -= dt;
                    if (p.smokeTimer <= 0) {
                        p.smokeTimer = 0.025;
                        spawnSmokePuff(p.mesh.position, 0.88, 0xeeeeee);
                    }
                    if (p.targetEnemy && enemies.includes(p.targetEnemy)) {
                        const targetCenter = p.targetEnemy.mesh.position.clone().add(new THREE.Vector3(0, p.targetEnemy.hitHeight, 0));
                        const desired = targetCenter.sub(p.mesh.position).normalize().multiplyScalar(64);
                        p.vel.lerp(desired, dt * 6.5);
                        p.mesh.lookAt(p.mesh.position.clone().add(p.vel));
                    }
                }

                p.mesh.position.addScaledVector(p.vel, dt);

                let hit = false;

                if (p.mesh.position.y <= 0.3) {
                    spawnVoxelExplosion(p.mesh.position, p.isHoming ? 1.5 : 0.45, p.isHoming);
                    hit = true;
                }

                if (!hit && p.isFriendly) {
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        const e = enemies[j];
                        const center = e.mesh.position.clone().add(new THREE.Vector3(0, e.hitHeight, 0));
                        const dist = p.mesh.position.distanceTo(center);
                        const triggerRadius = p.isHoming ? e.hitRadius + 2.2 : e.hitRadius;

                        if (dist <= triggerRadius) {
                            e.hp -= p.damage;
                            hit = true;
                            flashHitCrosshair();
                            spawnVoxelExplosion(p.mesh.position, p.isHoming ? 1.85 : 0.58, p.isHoming);

                            if (e.hp <= 0) {
                                const expScale = e.type === 'mech' ? 2.7 : (e.type === 'tank' ? 1.9 : 1.5);
                                spawnVoxelExplosion(center, expScale, true);
                                scene.remove(e.mesh);
                                enemies.splice(j, 1);

                                playerState.score += e.scoreValue;
                                playerState.kills++;

                                if (playerState.kills % 3 === 0 && playerState.missiles < playerState.maxMissiles) {
                                    playerState.missiles++;
                                }
                                if (playerState.kills % 10 === 0) {
                                    playerState.wave++;
                                    showCombatAlert(`WAVE ${playerState.wave} REINFORCEMENTS INBOUND!`);
                                }
                                updateHUD();
                                maintainBattlefieldPopulation(e.type);
                            }
                            break;
                        }
                    }
                } else if (!hit && !p.isFriendly) {
                    if (p.mesh.position.distanceTo(playerState.pos) < 2.6) {
                        takePlayerDamage(p.isHeavy ? 10 : 5);
                        spawnVoxelExplosion(p.mesh.position, 0.6, false);
                        hit = true;
                    } else if (p.mesh.position.z > 27.5 && Math.random() < 0.25) {
                        spawnVoxelExplosion(p.mesh.position, 0.78, false);
                        hit = true;
                    }
                }

                if (hit || p.life <= 0) {
                    scene.remove(p.mesh);
                    projectiles.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.life -= dt;
                pt.vel.y -= pt.gravity * dt;
                pt.mesh.position.addScaledVector(pt.vel, dt);

                if (pt.spin) {
                    pt.mesh.rotation.x += dt * 8;
                    pt.mesh.rotation.y += dt * 8;
                }

                if (pt.mesh.position.y < 0.2 && pt.gravity > 0) {
                    pt.mesh.position.y = 0.2;
                    pt.vel.y *= -0.38;
                }

                const ratio = Math.max(0, pt.life / pt.maxLife);
                pt.mesh.material.opacity = ratio;
                if (pt.shrink) {
                    pt.mesh.scale.multiplyScalar(0.97);
                } else if (pt.grow) {
                    pt.mesh.scale.multiplyScalar(pt.grow);
                }

                if (pt.life <= 0) {
                    scene.remove(pt.mesh);
                    pt.mesh.material.dispose();
                    particles.splice(i, 1);
                }
            }

            drawRadar(dt);
        }

        function maintainBattlefieldPopulation(destroyedType) {
            setTimeout(() => {
                if (destroyedType === 'mech') {
                    spawnMech((Math.random() - 0.5) * 24, -65 - Math.random() * 25);
                    showCombatAlert("WARNING: ENEMY GOLIATH MECH DEPLOYED!");
                } else if (destroyedType === 'plane') {
                    spawnFighterPlane();
                } else if (destroyedType === 'tank') {
                    spawnEnemyTank((Math.random() - 0.5) * 22, -60 - Math.random() * 20);
                } else {
                    spawnEnemyTrooper((Math.random() - 0.5) * 20, -45 - Math.random() * 20);
                }
            }, 1100);
        }

        function animate(now) {
            requestAnimationFrame(animate);
            const dt = Math.min(0.05, (now - lastTime) / 1000);
            lastTime = now;

            updateGame(dt, now * 0.001);
            if (composer) {
                composer.render();
            } else {
                renderer.render(scene, camera);
            }
        }

        window.onload = function () {
            lastTime = performance.now();
            animate(lastTime);
        };
    </script>
</body>
